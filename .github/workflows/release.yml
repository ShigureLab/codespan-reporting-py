name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, x86, aarch64]
    name: Ubuntu, ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python3.11
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-ubuntu-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
    name: Windows, ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    name: macOS, ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter python3.11
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # abi3 wheels cannot be loaded by free-threaded CPython. Build a separate
  # version-specific wheel for each native 64-bit release platform.
  free-threaded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-15-intel
            target: x86_64
          - os: macos-15
            target: aarch64
    runs-on: ${{ matrix.os }}
    name: Python 3.15t wheel, ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15t'
          allow-prereleases: true
      - name: Build free-threaded wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          args: --release --locked --out dist --interpreter ${{ runner.os == 'Linux' && 'python3.15t' || 'python' }}
          # The manylinux images provide their own CPython 3.15t interpreter.
          manylinux: '2_28'
          sccache: 'true'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-315t-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  wheel-test:
    needs: [linux, windows, macos, free-threaded]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
        python-version: ['3.15', '3.15t']
    runs-on: ${{ matrix.os }}
    name: Release wheel test, Python ${{ matrix.python-version }}, ${{ matrix.os }}
    env:
      EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install release wheel (no source fallback)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --only-binary=:all: --find-links dist codespan-reporting
          python -m pip install pytest
      - name: Test installed native extension
        run: python -m pytest -v

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, free-threaded, wheel-test, sdist]
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-release:
    runs-on: ubuntu-latest
    name: Publish to GitHub
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, free-threaded, wheel-test, sdist]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Get tag name
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Publish to GitHub
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
          tag_name: ${{ env.RELEASE_VERSION }}
